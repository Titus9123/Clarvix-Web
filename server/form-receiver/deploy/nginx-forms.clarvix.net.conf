# /etc/nginx/sites-available/forms.clarvix.net  (installed by install.sh AFTER the certificate exists)
limit_req_zone $binary_remote_addr zone=clarvix_form:10m rate=6r/m;

server {
    listen 80;
    server_name forms.clarvix.net;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name forms.clarvix.net;
    ssl_certificate     /etc/letsencrypt/live/forms.clarvix.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/forms.clarvix.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    client_max_body_size 20k;
    access_log off;                      # request bodies and IPs of leads are not logged

    location = /v1/contact {
        limit_except POST OPTIONS { deny all; }
        limit_req zone=clarvix_form burst=4 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }
    location = /healthz { proxy_pass http://127.0.0.1:8787; }
    location / { return 404; }
}
