# OPTIONAL hardening: limit the service to loopback + the SMTP server. Install as a drop-in ONLY after the receiver works:
#   mkdir -p /etc/systemd/system/clarvix-form.service.d && cp optional-network-lockdown.conf /etc/systemd/system/clarvix-form.service.d/lockdown.conf
#   systemctl daemon-reload && systemctl restart clarvix-form && deploy/smoke_test.sh   (revert by deleting the file if the test fails)
# Replace the placeholders with the real addresses of the SMTP server and the DNS resolver in /etc/resolv.conf.
[Service]
IPAddressDeny=any
IPAddressAllow=localhost
IPAddressAllow=SMTP_SERVER_IP
IPAddressAllow=DNS_RESOLVER_IP
