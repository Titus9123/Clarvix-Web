# /etc/nginx/sites-available/forms.clarvix.net  (then: ln -s into sites-enabled, certbot --nginx -d forms.clarvix.net)
limit_req_zone $binary_remote_addr zone=clarvix_form:10m rate=6r/m;

server {
    listen 80;
    server_name forms.clarvix.net;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name forms.clarvix.net;
    # ssl_certificate / ssl_certificate_key are added by certbot

    client_max_body_size 20k;
    access_log off;                      # request bodies and IPs of leads are not logged

    location = /v1/contact {
        limit_req zone=clarvix_form burst=4 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_read_timeout 25s;
    }
    location = /healthz { proxy_pass http://127.0.0.1:8787; }
    location / { return 404; }
}
